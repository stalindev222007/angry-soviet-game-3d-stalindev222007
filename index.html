<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>Angry Soviet 3D</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;height:100%;width:100%;position:fixed;}
  canvas{display:block;touch-action:none;}
  *{box-sizing:border-box;}


  #lookLayer{position:fixed;inset:0;z-index:4;touch-action:none;pointer-events:none;}


  #joyBase{position:fixed;bottom:20px;left:20px;width:118px;height:118px;border-radius:50%;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,80,80,.55);
    z-index:12;touch-action:none;display:none;box-shadow:0 0 18px rgba(255,60,60,.25);}
  #joyKnob{position:absolute;top:50%;left:50%;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,120,120,.75), rgba(255,40,40,.35));
    border:2px solid rgba(255,140,140,.85);transform:translate(-50%,-50%);pointer-events:none;
    box-shadow:0 0 12px rgba(255,60,60,.6);}


  #fireBtnTouch{position:fixed;bottom:22px;right:20px;width:100px;height:100px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e53935, #a01010);
    color:#fff;font-family:'Arial Black',Arial,sans-serif;font-size:15px;font-weight:900;
    border:3px solid #fff;z-index:13;display:none;align-items:center;justify-content:center;
    text-shadow:1px 1px 2px #000;touch-action:none;
    box-shadow:0 0 22px rgba(255,40,40,.75), inset 0 0 18px rgba(0,0,0,.5);}
  #fireBtnTouch:active{background:radial-gradient(circle at 35% 30%, #ff5252, #c10000);transform:scale(.95);}


  #jumpBtnTouch{position:fixed;bottom:132px;right:36px;width:60px;height:60px;border-radius:50%;
    background:rgba(60,60,80,.9);color:#fff;font-family:'Arial Black',Arial,sans-serif;
    font-size:20px;font-weight:900;border:3px solid #fff;z-index:13;display:none;
    align-items:center;justify-content:center;text-shadow:1px 1px 2px #000;touch-action:none;
    box-shadow:0 0 12px rgba(0,0,0,.6);}
  #jumpBtnTouch:active{background:#4a4a60;transform:scale(.94);}


  #reloadBtnTouch{position:fixed;bottom:132px;right:110px;width:60px;height:60px;border-radius:50%;
    background:rgba(80,50,20,.9);color:#ffcc00;font-family:'Arial Black',Arial,sans-serif;
    font-size:8px;font-weight:900;border:3px solid #ffcc00;z-index:13;display:none;
    align-items:center;justify-content:center;text-align:center;line-height:1.05;
    text-shadow:1px 1px 2px #000;touch-action:none;padding:0;
    box-shadow:0 0 12px rgba(255,180,0,.55);}
  #reloadBtnTouch:active{background:#a06020;transform:scale(.94);}
  #reloadBtnTouch.cooling{opacity:.35;background:rgba(40,40,40,.9);border-color:#666;color:#888;}


  #mobileWeapons{position:fixed;top:10px;right:10px;display:none;flex-direction:row;gap:6px;z-index:12;}
  .mWeapBtn{width:88px;height:54px;border-radius:9px;padding:2px 4px;
    background:rgba(30,30,30,.9);color:#fff;
    font-family:'Arial Black',Arial,sans-serif;font-size:9px;font-weight:900;
    border:2px solid rgba(255,255,255,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;line-height:1.1;cursor:pointer;touch-action:none;
    text-shadow:1px 1px 2px #000;letter-spacing:.3px;}
  .mWeapBtn .wNum{font-size:12px;color:#ffcc00;margin-bottom:0;}
  .mWeapBtn .wLabel{font-size:9px;}
  .mWeapBtn .wAmmo{font-size:10px;color:#ff8888;margin-top:1px;font-family:monospace;}
  .mWeapBtn.active{background:linear-gradient(180deg,#ff9800,#d07000);color:#000;border-color:#fff;
    box-shadow:0 0 15px rgba(255,152,0,.9);}
  .mWeapBtn.active .wNum,
  .mWeapBtn.active .wAmmo{color:#000;}
  .mWeapBtn.empty .wAmmo{color:#ff2222;}
  .mWeapBtn:active{transform:scale(.96);}


  #menu{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#2a0000 0%,#0a0000 70%,#000 100%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:16px;overflow-y:auto;}
  #menu.hidden{display:none;}
  #title{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(28px,6vw,58px);font-weight:900;letter-spacing:4px;
    color:#c10000;text-shadow:0 0 20px #ff0000,0 0 46px #700000,4px 4px 0 #000;margin:0;animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{text-shadow:0 0 20px #ff0000,0 0 46px #700000,4px 4px 0 #000;}50%{text-shadow:0 0 32px #ff2a2a,0 0 70px #900000,4px 4px 0 #000;}}
  #sub{color:#ff8888;font-size:13px;letter-spacing:3px;margin-top:-12px;}
  #playBtn{font-family:'Arial Black',Arial,sans-serif;font-size:20px;font-weight:900;letter-spacing:4px;padding:14px 50px;
    color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:10px;cursor:pointer;text-shadow:2px 2px 0 #000;
    box-shadow:0 0 20px #ff0000;transition:transform .15s;}
  #playBtn:hover{transform:scale(1.06);background:#c10000;}
  #controls{color:#ddd;font-size:12px;line-height:1.8;background:rgba(30,0,0,.55);border:1px solid #5a0000;
    border-radius:10px;padding:12px 18px;max-width:420px;text-align:left;}
  #controls b{color:#ff5252;}


  #rotateHint{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff;text-align:center;padding:20px;}
  #rotateHint.show{display:flex;}
  #rotateHint .phone{width:90px;height:150px;border:4px solid #ff2a2a;border-radius:12px;position:relative;
    box-shadow:0 0 24px #ff2a2a;animation:rotatePhone 2s ease-in-out infinite;}
  #rotateHint .phone::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:26px;height:4px;background:#ff2a2a;border-radius:2px;}
  @keyframes rotatePhone{0%,40%{transform:rotate(0);}60%,100%{transform:rotate(90deg);}}
  #rotateHint .rTitle{font-family:'Arial Black',Arial,sans-serif;font-size:20px;color:#ff2a2a;letter-spacing:3px;}
  #rotateHint .rSub{font-size:13px;color:#ccc;max-width:280px;}


  #hud{position:fixed;top:10px;left:14px;color:#fff;font-size:14px;line-height:1.45;text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;}
  #hud span{color:#ff5252;font-weight:bold;}
  #hud .rainbow{color:#e040fb;}
  #hpWrap{width:150px;height:12px;background:#1a0000;border:2px solid #5a0000;border-radius:4px;margin-top:3px;overflow:hidden;}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff2a2a,#c10000);transition:width .15s;}


  #weaponName{position:fixed;bottom:14px;right:18px;color:#ffcc00;font-size:14px;letter-spacing:2px;
    text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;font-weight:bold;text-align:right;}
  #reloadHint{position:fixed;bottom:48px;right:18px;color:#ff5522;font-size:12px;letter-spacing:2px;
    text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;font-weight:bold;display:none;
    animation:blink .8s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}


  #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(255,255,255,.85);box-shadow:0 0 4px #000;z-index:5;pointer-events:none;}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.7);}
  #crosshair::before{width:14px;height:2px;top:2px;left:-4px;}
  #crosshair::after{width:2px;height:14px;left:2px;top:-4px;}


  #resumeHint{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;
    color:#fff;font-size:20px;font-family:'Arial Black',Arial,sans-serif;letter-spacing:2px;text-shadow:2px 2px 0 #000;}
  #resumeHint.show{display:flex;}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(circle,transparent 40%,rgba(200,0,0,.65) 100%);opacity:0;transition:opacity .12s;}
  #gameOver{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;}
  #gameOver.show{display:flex;}
  #goTitle{font-family:'Arial Black',Arial,sans-serif;font-size:40px;color:#ff2a2a;text-shadow:0 0 24px #ff0000,3px 3px 0 #000;letter-spacing:3px;}
  #goStats{color:#eee;font-size:15px;text-align:center;line-height:1.6;}
  #goStats b{color:#ff5252;}
  #restartBtn{font-family:'Arial Black',Arial,sans-serif;font-size:17px;font-weight:900;letter-spacing:3px;padding:12px 36px;
    color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:8px;cursor:pointer;box-shadow:0 0 16px #ff0000;}
  #restartBtn:hover{background:#c10000;}
</style>
</head>
<body>


<div id="menu">
  <h1 id="title">ANGRY SOVIET 3D</h1>
  <div id="sub">ВЫЖИВИ. ОТСТРЕЛИВАЙСЯ. НЕ УМРИ.</div>
  <button id="playBtn">ИГРАТЬ</button>
  <div id="controls"></div>
</div>


<div id="rotateHint">
  <div class="phone"></div>
  <div class="rTitle">ПОВЕРНИ УСТРОЙСТВО</div>
  <div class="rSub">Игра в горизонтальной ориентации. Поверни телефон боком.</div>
</div>


<div id="resumeHint">КЛИКНИ, ЧТОБЫ ПРОДОЛЖИТЬ</div>


<div id="hud" style="display:none;">
  Зомби: <span id="zScore">0</span> &nbsp; Вампиров: <span id="vScore">0</span><br>
  Радужных: <span class="rainbow" id="rScore">0</span> &nbsp; Генералов: <span id="gScore">0</span><br>
  HP: <span id="hpNum">100</span>
  <div id="hpWrap"><div id="hpBar"></div></div>
</div>
<div id="weaponName" style="display:none;">ПИСТОЛЕТ &middot; 12/12</div>
<div id="reloadHint">ПЕРЕЗАРЯДКА...</div>
<div id="crosshair" style="display:none;"></div>
<div id="dmgFlash"></div>


<div id="lookLayer"></div>


<div id="joyBase"><div id="joyKnob"></div></div>
<button id="fireBtnTouch">ОГОНЬ</button>
<button id="jumpBtnTouch">▲</button>
<button id="reloadBtnTouch">ПЕРЕ-<br>ЗАРЯДКА</button>
<div id="mobileWeapons">
  <button class="mWeapBtn" id="mWeapPistol">
    <span class="wNum">1</span>
    <span class="wLabel">ПИСТОЛЕТ</span>
    <span class="wAmmo">12/12</span>
  </button>
  <button class="mWeapBtn" id="mWeapShotgun">
    <span class="wNum">2</span>
    <span class="wLabel">ДРОБОВИК</span>
    <span class="wAmmo">6/6</span>
  </button>
</div>


<div id="gameOver">
  <div id="goTitle">ТЫ ПОГИБ</div>
  <div id="goStats"></div>
  <button id="restartBtn">В МЕНЮ</button>
</div>


<canvas id="c"></canvas>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ANGRY SOVIET 3D — landscape + shell loading animation
   ============================================================ */


const SafeStore = (() => {
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    get(k,d){ if(!ok) return d; try { const v = localStorage.getItem(k); return v===null?d:v; } catch(e){ return d; } },
    set(k,v){ if(!ok) return; try { localStorage.setItem(k, String(v)); } catch(e){} }
  };
})();
let bestScore = +(SafeStore.get('as3d_best', 0)) || 0;


const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;


// ============================================================
// ORIENTATION LOCK → LANDSCAPE
// ============================================================
async function enterLandscapeFullscreen(){
  if (!isTouchDevice) return;
  const el = document.documentElement;


  // 1. Request fullscreen (required for orientation lock on most browsers)
  try {
    if (el.requestFullscreen) {
      if (!document.fullscreenElement) await el.requestFullscreen({ navigationUI: 'hide' });
    } else if (el.webkitRequestFullscreen) {
      if (!document.webkitFullscreenElement) el.webkitRequestFullscreen();
    } else if (el.mozRequestFullScreen) {
      if (!document.mozFullScreenElement) el.mozRequestFullScreen();
    } else if (el.msRequestFullscreen) {
      if (!document.msFullscreenElement) el.msRequestFullscreen();
    }
  } catch(e) { /* some browsers block without user gesture */ }


  // 2. Lock orientation
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape').catch(()=>{});
    } else if (screen.lockOrientation) {
      screen.lockOrientation('landscape');
    } else if (screen.mozLockOrientation) {
      screen.mozLockOrientation('landscape');
    } else if (screen.msLockOrientation) {
      screen.msLockOrientation('landscape');
    }
  } catch(e) { /* iOS Safari doesn't support this */ }
}


// Detect portrait on touch device → show hint
function updateOrientationHint(){
  if (!isTouchDevice) return;
  const isPortrait = innerHeight > innerWidth;
  const hint = document.getElementById('rotateHint');
  if (isPortrait && gameActive) {
    hint.classList.add('show');
  } else {
    hint.classList.remove('show');
  }
}
addEventListener('resize', updateOrientationHint);
addEventListener('orientationchange', () => setTimeout(updateOrientationHint, 200));


// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouchDevice });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouchDevice ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);


const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0505);
scene.fog = new THREE.FogExp2(0x140505, 0.026);


const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const playerRig = new THREE.Object3D();
playerRig.position.set(0, 1.7, 0);
playerRig.add(camera);
scene.add(playerRig);


function handleResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateOrientationHint();
}
addEventListener('resize', handleResize);
addEventListener('orientationchange', () => setTimeout(handleResize, 250));


// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0x776060, 1.8));
const moon = new THREE.DirectionalLight(0xaabbff, 0.5);
moon.position.set(50, 80, -30);
scene.add(moon);
const flashlight = new THREE.PointLight(0xffddaa, 1.5, 30, 2);
camera.add(flashlight);


const MAX_ENEMY_LIGHTS = isTouchDevice ? 3 : 4;
const enemyLightPool = [];
for (let i = 0; i < MAX_ENEMY_LIGHTS; i++) {
  const l = new THREE.PointLight(0xff2266, 0, 5, 2);
  scene.add(l);
  enemyLightPool.push(l);
}


// ---------- Arena ----------
const ARENA = 60;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2, ARENA*2, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x1c1414, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const grid = new THREE.GridHelper(ARENA*2, 40, 0x5a0000, 0x2a1010);
grid.position.y = 0.01;
scene.add(grid);


const wallMat = new THREE.MeshStandardMaterial({ color: 0x241010, roughness: 1 });
function addWall(x,z,w,d){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,6,d), wallMat);
  m.position.set(x,3,z); scene.add(m);
}
addWall(0,-ARENA,ARENA*2,2); addWall(0,ARENA,ARENA*2,2);
addWall(-ARENA,0,2,ARENA*2); addWall(ARENA,0,2,ARENA*2);


const rubbleMat = new THREE.MeshStandardMaterial({ color: 0x2c1c1c, roughness: 1 });
for(let i=0;i<26;i++){
  const s = 1 + Math.random()*2.4;
  const box = new THREE.Mesh(new THREE.BoxGeometry(s,s*0.8,s), rubbleMat);
  const a = Math.random()*Math.PI*2, r = 8 + Math.random()*(ARENA-12);
  box.position.set(Math.cos(a)*r, s*0.4, Math.sin(a)*r);
  box.rotation.y = Math.random()*Math.PI;
  scene.add(box);
}


// ---------- Shared GEO / MAT ----------
const GEO = {
  zBody:     new THREE.SphereGeometry(0.55, 16, 14),
  zEar:      new THREE.SphereGeometry(0.16, 10, 8),
  zTail:     new THREE.SphereGeometry(0.095, 8, 6),
  zEye:      new THREE.SphereGeometry(0.16, 12, 10),
  zPupil:    new THREE.SphereGeometry(0.08, 10, 8),
  zMouth:    new THREE.TorusGeometry(0.13, 0.028, 6, 14, Math.PI),
  zRing:     new THREE.TorusGeometry(0.19, 0.035, 6, 16),
  crossV:    new THREE.BoxGeometry(0.055, 0.22, 0.04),
  crossH:    new THREE.BoxGeometry(0.20, 0.055, 0.04),
  vHelm:     new THREE.SphereGeometry(0.39, 14, 10, 0, Math.PI*2, 0, Math.PI/2),
  vHelmRim:  new THREE.TorusGeometry(0.39, 0.035, 6, 20),
  gHelm:     new THREE.SphereGeometry(0.55, 14, 10, 0, Math.PI*2, 0, Math.PI/2),
  gHelmRim:  new THREE.TorusGeometry(0.55, 0.045, 6, 22),
  gCircle:   new THREE.CircleGeometry(0.13, 20),
  gunBody:   new THREE.BoxGeometry(0.09, 0.14, 0.30),
  gunBarrel: new THREE.CylinderGeometry(0.028, 0.028, 0.20, 8),
  mgBody:    new THREE.BoxGeometry(0.10, 0.16, 0.42),
  mgBarrel:  new THREE.CylinderGeometry(0.035, 0.035, 0.40, 8),
  mgMag:     new THREE.BoxGeometry(0.09, 0.22, 0.14),
  vampProj:  new THREE.SphereGeometry(0.12, 8, 8),
  genProj:   new THREE.SphereGeometry(0.15, 8, 8),
  pickBase:  new THREE.BoxGeometry(0.55, 0.5, 0.1),
  pickC1:    new THREE.BoxGeometry(0.5, 0.15, 0.15),
  pickC2:    new THREE.BoxGeometry(0.15, 0.15, 0.5),
  bloodDrop: new THREE.BoxGeometry(1, 1, 1),
  bullet:    new THREE.BoxGeometry(0.05, 0.05, 0.55),
  pellet:    new THREE.BoxGeometry(0.04, 0.04, 0.30),
  spark:     new THREE.BoxGeometry(0.07, 0.07, 0.07),
  pBody:     new THREE.BoxGeometry(0.08,0.12,0.50),
  pBarrel:   new THREE.CylinderGeometry(0.025,0.025,0.30,10),
  pGrip:     new THREE.BoxGeometry(0.06,0.15,0.09),
  sReceiver: new THREE.BoxGeometry(0.09,0.11,0.32),
  sStock:    new THREE.BoxGeometry(0.08,0.10,0.30),
  sGrip:     new THREE.BoxGeometry(0.06,0.13,0.09),
  sBarrel:   new THREE.CylinderGeometry(0.033,0.033,0.58,10),
  sShell:    new THREE.CylinderGeometry(0.028,0.028,0.085,8),
  sHinge:    new THREE.CylinderGeometry(0.03,0.03,0.10,8),
};


const MAT = {
  eyeWhite:    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.5 }),
  whiteGlow:   new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5, roughness: 0.5 }),
  pupil:       new THREE.MeshBasicMaterial({ color: 0x000000 }),
  redPupil:    new THREE.MeshBasicMaterial({ color: 0xc62828 }),
  redGlow:     new THREE.MeshBasicMaterial({ color: 0xff0000 }),
  black:       new THREE.MeshBasicMaterial({ color: 0x000000 }),
  zombieMouth: new THREE.MeshBasicMaterial({ color: 0x4a0a2a }),
  vampBody:    new THREE.MeshStandardMaterial({ color: 0x0d47a1, emissive: 0x0a2d68, emissiveIntensity: 0.7, roughness: 0.65 }),
  vampHelm:    new THREE.MeshStandardMaterial({ color: 0x607d8b, emissive: 0x37474f, emissiveIntensity: 0.4, metalness: 0.4, roughness: 0.5 }),
  genBody:     new THREE.MeshStandardMaterial({ color: 0x0d47a1, emissive: 0x0a2d68, emissiveIntensity: 0.8, roughness: 0.6 }),
  genHelm:     new THREE.MeshStandardMaterial({ color: 0x0a0a0a, emissive: 0x1a1a1a, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.4 }),
  gun:         new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.6, roughness: 0.4 }),
  gunGen:      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.6, roughness: 0.4 }),
  wood:        new THREE.MeshStandardMaterial({ color: 0x4a2a12, roughness: 0.85 }),
  shellRed:    new THREE.MeshStandardMaterial({ color: 0xc00000, metalness: 0.2, roughness: 0.6 }),
  shellBrass:  new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.8, roughness: 0.35 }),
  rainbow:     new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.6, roughness: 0.7 }),
  rainbowMouth:new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.8, roughness: 0.6 }),
  rainbowRing: new THREE.MeshBasicMaterial({ color: 0xffff00 }),
  vampProjMat: new THREE.MeshBasicMaterial({ color: 0xff3333 }),
  genProjMat:  new THREE.MeshBasicMaterial({ color: 0xffffff }),
  pickBase:    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x882222, emissiveIntensity: 0.3 }),
  pickRed:     new THREE.MeshStandardMaterial({ color: 0xe53935, emissive: 0x882222, emissiveIntensity: 0.5 }),
  bloodMats: [
    new THREE.MeshBasicMaterial({ color: 0x8a0000 }),
    new THREE.MeshBasicMaterial({ color: 0x6e0000 }),
    new THREE.MeshBasicMaterial({ color: 0xa01010 }),
    new THREE.MeshBasicMaterial({ color: 0x550000 }),
  ],
  sparkMats: [
    new THREE.MeshBasicMaterial({ color: 0xffdd66 }),
    new THREE.MeshBasicMaterial({ color: 0xff9922 }),

// ---------- Reload transforms ----------
function pistolReloadTransform(p){
  let tx=0, ty=0, tz=0, rx=0, ry=0, rz=0;
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  if (p < 0.35) {
    const e = ease(p / 0.35);
    tx = -0.22*e; ty = -0.48*e; tz = 0.14*e;
    rx = 0.55*e;  ry = -0.45*e; rz = 0.95*e;
  } else if (p < 0.72) {
    tx = -0.22; ty = -0.48; tz = 0.14;
    rx = 0.55;  ry = -0.45; rz = 0.95;
    ty += Math.sin(p * 60) * 0.008;
  } else {
    const e = ease((p - 0.72) / 0.28);
    tx = -0.22*(1-e); ty = -0.48*(1-e); tz = 0.14*(1-e);
    rx = 0.55*(1-e);  ry = -0.45*(1-e); rz = 0.95*(1-e);
  }
  return { tx, ty, tz, rx, ry, rz };
}


// Shotgun: returns pivot rotation + per-shell state
function shotgunReloadTransform(p){
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  let pivotRot = 0;
  const shellStates = [];


  // Phase boundaries
  const OPEN_END   = 0.22;
  const CLOSE_START = 0.78;


  // Shell loading window inside 0.22..0.78 → 0.56 duration
  // Each shell: fly duration, staggered
  const loadWinStart = OPEN_END;
  const loadWinEnd   = CLOSE_START;
  const totalWin     = loadWinEnd - loadWinStart;      // 0.56
  const perShellStep = totalWin / SHELL_COUNT;         // ~0.0933
  const flyDur       = perShellStep * 1.15;            // shell flies 15% longer than its slot


  if (p < OPEN_END) {
    pivotRot = -0.95 * ease(p / OPEN_END);
    for (let i = 0; i < SHELL_COUNT; i++) shellStates.push({ state: 'hidden', t: 0 });
  } else if (p < CLOSE_START) {
    pivotRot = -0.95;
    for (let i = 0; i < SHELL_COUNT; i++) {
      const shellStart = loadWinStart + i * perShellStep;
      const shellEnd   = shellStart + flyDur;
      if (p < shellStart) {
        shellStates.push({ state: 'hidden', t: 0 });
      } else if (p < shellEnd) {
        const t = (p - shellStart) / flyDur;
        shellStates.push({ state: 'flying', t });
      } else {
        shellStates.push({ state: 'loaded', t: 1 });
      }
    }
  } else {
    pivotRot = -0.95 * (1 - ease((p - CLOSE_START) / (1 - CLOSE_START)));
    for (let i = 0; i < SHELL_COUNT; i++) shellStates.push({ state: 'loaded', t: 1 });
  }
  return { pivotRot, shellStates };
}


function animateWeaponModel(dt){
  pistolGroup.visible = (currentWeapon === 'pistol');
  shotgunGroup.visible = (currentWeapon === 'shotgun');
  pistolGroup.position.set(0,0,0);
  pistolGroup.rotation.set(0,0,0);


  if (reloading) {
    const prog = 1 - reloadTimer / reloadDuration;
    if (currentWeapon === 'pistol') {
      const t = pistolReloadTransform(prog);
      pistolGroup.position.set(t.tx, t.ty, t.tz);
      pistolGroup.rotation.set(t.rx, t.ry, t.rz);
    } else {
      const t = shotgunReloadTransform(prog);
      sBarrelPivot.rotation.x = t.pivotRot;


      for (let i = 0; i < SHELL_COUNT; i++) {
        const sh = sShells[i];
        const st = t.shellStates[i];
        if (st.state === 'hidden') {
          sh.visible = false;
        } else if (st.state === 'flying') {
          sh.visible = true;
          // Ease out for snappy insertion
          const e = 1 - Math.pow(1 - st.t, 3);
          const start = sh.userData.flyStart;
          const end   = sh.userData.loadedPos;
          sh.position.x = start.x + (end.x - start.x) * e;
          sh.position.z = start.z + (end.z - start.z) * e;
          // Small arc: dip slightly then up
          const arcLift = Math.sin(st.t * Math.PI) * 0.10;
          sh.position.y = start.y + (end.y - start.y) * e + arcLift;
        } else {
          // loaded
          sh.visible = true;
          sh.position.copy(sh.userData.loadedPos);
        }
      }
    }
  } else {
    sBarrelPivot.rotation.x = 0;
    for (let i = 0; i < SHELL_COUNT; i++) {
      sShells[i].visible = false;
      sShells[i].position.copy(sShells[i].userData.flyStart);
    }
  }
}


function startReload(){
  if (reloading) return;
  const w = WEAPONS[currentWeapon];
  if (ammo[currentWeapon] >= w.maxAmmo) return;
  reloading = true;
  reloadDuration = w.reloadTime;
  reloadTimer = reloadDuration;
  document.getElementById('reloadHint').style.display = 'block';
  if (reloadBtnTouch) reloadBtnTouch.classList.add('cooling');
  if (isTouchDevice && navigator.vibrate) navigator.vibrate(20);
}
function switchWeapon(name){
  if (name === currentWeapon) return;
  if (!WEAPONS[name]) return;
  if (weaponSwitchCd > 0) return;
  reloading = false;
  reloadTimer = 0;
  document.getElementById('reloadHint').style.display = 'none';
  if (reloadBtnTouch) reloadBtnTouch.classList.remove('cooling');
  // Hide shells
  for (let i = 0; i < SHELL_COUNT; i++) sShells[i].visible = false;
  currentWeapon = name;
  weaponSwitchCd = 0.25;
  updateWeaponHUD();
  if (isTouchDevice && navigator.vibrate) navigator.vibrate(12);
}

function shoot(){
  const w = WEAPONS[currentWeapon];
  recoil = w.recoil;
  muzzleLight.intensity = w.muzzleFlash;
  camera.getWorldDirection(_rayDir);
  const muzzleWorld = getActiveMuzzle();
  for (let i = 0; i < w.pellets; i++) {
    const dir = new THREE.Vector3().copy(_rayDir);
    if (w.pellets > 1 || w.spread > 0) {
      dir.x += (Math.random() - 0.5) * w.spread * 2;
      dir.y += (Math.random() - 0.5) * w.spread * 2;
      dir.z += (Math.random() - 0.5) * w.spread * 2;
      dir.normalize();
    }
    const b = new THREE.Mesh(w.bulletGeo, w.bulletMat);
    b.position.copy(muzzleWorld);
    b.position.addScaledVector(dir, 0.4);
    _tmpQ.setFromUnitVectors(_upZ, dir);
    b.quaternion.copy(_tmpQ);
    scene.add(b);
    bullets.push({ mesh: b, vel: dir.clone().multiplyScalar(w.bulletSpeed), life: 1.2, prevPos: b.position.clone(), damage: w.damage });
  }
  spawnMuzzleSparks(muzzleWorld, _rayDir);
  if (isTouchDevice && navigator.vibrate) navigator.vibrate(8);
}

  gun.position.set(0.55 * S, 0.88 * S, 0.55 * S); gun.rotation.y = -0.20; g.add(gun);
  g.userData.isEnemyRoot = true;

  return { group: g, hp: 60, maxHp: 60, speed: 1.0, alive: true, fireCd: 1.5 + Math.random(), radius: 1.05,

    bleedTimer: 0, bleedAccum: 0, woundLocal: new THREE.Vector3(0, 1.5, 0), kind: 'general' };
}


function spawnEdgePos(){
  const p = playerRig.position;
  let bx = 0, bz = 0, bd = -1;
  for (let i = 0; i < 8; i++) {
    const a = Math.random()*Math.PI*2;
    const r = ARENA - 3;
    const cx = Math.cos(a)*r, cz = Math.sin(a)*r;
    const d = (cx - p.x)*(cx - p.x) + (cz - p.z)*(cz - p.z);
    if (d > bd) { bd = d; bx = cx; bz = cz; }
  }
  return _tmpV1.set(bx, 0, bz);
}


function spawnPickup(){

}


function spawnBloodBurst(worldPos, count, force){
  for(let i = 0; i < count; i++){
    const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
    const size = 0.04 + Math.random()*0.11;
    const m = new THREE.Mesh(GEO.bloodDrop, mat);
    m.scale.setScalar(size);
    m.position.copy(worldPos);
    const a = Math.random()*Math.PI*2;
    const up = Math.random()*0.9 - 0.15;
    const speed = force * (0.6 + Math.random()*0.9);
    const dir = _tmpV2.set(
      Math.cos(a)*(1 - Math.abs(up)*0.6),
      up + 0.35,
      Math.sin(a)*(1 - Math.abs(up)*0.6)
    ).normalize();
    scene.add(m);
    bloodDrops.push({ mesh: m, vel: dir.clone().multiplyScalar(speed), life: 4 + Math.random()*2, size, poolChance: 0.45 });
  }
}
function spawnBloodStreamDrop(worldPos){
  const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
  const size = 0.035 + Math.random()*0.05;
  const m = new THREE.Mesh(GEO.bloodDrop, mat);
  m.scale.setScalar(size);
  m.position.copy(worldPos);
  const vel = new THREE.Vector3((Math.random()-0.5)*0.8, -0.5 - Math.random()*0.8, (Math.random()-0.5)*0.8);
  scene.add(m);
  bloodDrops.push({ mesh: m, vel, life: 5, size, poolChance: 0.8 });
}
function addBloodPool(x, z, size){
  if (bloodPools.length >= 120) { const old = bloodPools.shift(); scene.remove(old.mesh); }
  const geo = BLOOD_POOL_GEOS[(Math.random()*BLOOD_POOL_GEOS.length)|0];
  const mat = BLOOD_POOL_MATS[(Math.random()*BLOOD_POOL_MATS.length)|0];
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.random()*Math.PI*2;
  m.scale.setScalar(size);
  m.position.set(x, 0.018 + Math.random()*0.012, z);
  scene.add(m);
  bloodPools.push({ mesh: m, life: 35 + Math.random()*25, baseScale: size });
}
function updateBlood(dt){
  for (let i = bloodDrops.length - 1; i >= 0; i--) {
    const d = bloodDrops[i];
    d.vel.y -= 20 * dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    d.life -= dt;
    if (d.mesh.position.y <= d.size * 0.5) {
      if (Math.random() < d.poolChance) {
        const px = d.mesh.position.x, pz = d.mesh.position.z;
        if (Math.abs(px) < ARENA - 1 && Math.abs(pz) < ARENA - 1)
          addBloodPool(px, pz, d.size * (5 + Math.random()*6));
      }
      scene.remove(d.mesh); bloodDrops.splice(i, 1); continue;
    }
    if (Math.abs(d.mesh.position.x) > ARENA || Math.abs(d.mesh.position.z) > ARENA || d.life <= 0) {
      scene.remove(d.mesh); bloodDrops.splice(i, 1);
    }
  }
  for (let i = bloodPools.length - 1; i >= 0; i--) {
    const p = bloodPools[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.mesh); bloodPools.splice(i, 1); }
    else if (p.life < 8) p.mesh.scale.setScalar(p.baseScale * Math.max(0.4, p.life/8));
  }
}


function spawnMuzzleSparks(worldPos, dir){
  for (let i = 0; i < 8; i++) {
    const mat = MAT.sparkMats[(Math.random()*MAT.sparkMats.length)|0];
    const m = new THREE.Mesh(GEO.spark, mat);
    m.position.copy(worldPos);
    const v = _tmpV2.copy(dir);
    v.x += (Math.random()-0.5)*0.55;
    v.y += (Math.random()-0.5)*0.55;
    v.z += (Math.random()-0.5)*0.55;
    v.normalize().multiplyScalar(7 + Math.random()*6);
    scene.add(m);
    sparks.push({ mesh: m, vel: v.clone(), life: 0.14 + Math.random()*0.14 });
  }
}
function updateSparks(dt){
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vel.y -= 12 * dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    s.life -= dt;
    s.mesh.scale.setScalar(Math.max(0.1, s.life * 5));
    if (s.life <= 0) { scene.remove(s.mesh); sparks.splice(i, 1); }
  }
}

const joy = { active: false, id: null, dx: 0, dy: 0 };
const JOY_MAX = 42;
function joyMove(x, y){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = x - cx, dy = y - cy;
  const len = Math.hypot(dx, dy);
  if (len > JOY_MAX){ dx = dx/len*JOY_MAX; dy = dy/len*JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(){
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
joyBase.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joyMove(t.clientX, t.clientY);
}, { passive: false });
joyBase.addEventListener('touchmove', e => {
  e.preventDefault(); e.stopPropagation();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){ joyMove(t.clientX, t.clientY); break; }
  }
}, { passive: false });
joyBase.addEventListener('touchend', e => {
  e.preventDefault(); e.stopPropagation();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){ joyEnd(); break; }
  }
}, { passive: false });
joyBase.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, { passive: false });


const aimTouches = new Map();
const AIM_SENS = 0.0058;
lookLayer.addEventListener('touchstart', e => {
  for(const t of e.changedTouches){
    aimTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
}, { passive: true });
lookLayer.addEventListener('touchmove', e => {
  for(const t of e.changedTouches){
    const prev = aimTouches.get(t.identifier);
    if(!prev) continue;
    const dx = t.clientX - prev.x, dy = t.clientY - prev.y;
    yaw -= dx * AIM_SENS;
    pitch -= dy * AIM_SENS;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    aimTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
}, { passive: true });
function clearAimTouch(e){ for(const t of e.changedTouches) aimTouches.delete(t.identifier); }

function updateBullets(dt){
  const targets = [];
  for (const z of zombies) if (z.alive) targets.push(z.group);
  for (const v of vampires) if (v.alive) targets.push(v.group);
  for (const r of rainbows) if (r.alive) targets.push(r.group);
  for (const g of generals) if (g.alive) targets.push(g.group);


  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.prevPos.copy(b.mesh.position);
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;


    const segX = b.mesh.position.x - b.prevPos.x;
    const segY = b.mesh.position.y - b.prevPos.y;
    const segZ = b.mesh.position.z - b.prevPos.z;
    const segLen = Math.sqrt(segX*segX + segY*segY + segZ*segZ);
    let hit = null;
    if (segLen > 0.0001 && targets.length) {
      _tmpV2.set(segX / segLen, segY / segLen, segZ / segLen);
      raycaster.set(b.prevPos, _tmpV2);
      raycaster.far = segLen;
      const hits = raycaster.intersectObjects(targets, true);
      raycaster.far = Infinity;
      if (hits.length) hit = hits[0];
    }
    if (hit) {
      let root = hit.object;
      while (root.parent && !root.userData.isEnemyRoot) root = root.parent;
      for (const arr of [zombies, vampires, rainbows, generals]) {
        const e = arr.find(x => x.group === root);
        if (e) {
          _tmpV3.copy(b.vel).normalize();
          damageEnemy(e, b.damage, hit.point, _tmpV3);
          break;
        }
      }
      scene.remove(b.mesh); bullets.splice(i, 1); continue;
    }
    const p = b.mesh.position;
    if (b.life <= 0 || Math.abs(p.x) > ARENA || Math.abs(p.z) > ARENA || p.y < 0.05 || p.y > 12) {
      scene.remove(b.mesh); bullets.splice(i, 1);
    }
  }
}


function damageEnemy(e, dmg, hitPoint, bulletDir){
  e.hp -= dmg;
  spawnBloodBurst(hitPoint, 8, 4 + Math.random()*2);
  for (let i = 0; i < 4; i++) {
    const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
    const size = 0.05 + Math.random()*0.09;
    const m = new THREE.Mesh(GEO.bloodDrop, mat);
    m.scale.setScalar(size);
    m.position.copy(hitPoint);
    const v = bulletDir.clone();
    v.x += (Math.random()-0.5)*0.7;
    v.y += (Math.random()-0.2)*0.7;
    v.z += (Math.random()-0.5)*0.7;
    v.normalize().multiplyScalar(6 + Math.random()*5);
    scene.add(m);
    bloodDrops.push({ mesh: m, vel: v, life: 4, size, poolChance: 0.5 });
  }
  if (e.hp <= 0 && e.alive) {
    e.alive = false;
    _tmpV3.copy(e.group.position); _tmpV3.y += 1.1;
    spawnBloodBurst(_tmpV3, 20, 8);
    addBloodPool(e.group.position.x, e.group.position.z, 1.1 + Math.random()*0.7);
    scene.remove(e.group);
    if (e.kind === 'zombie')   { zScore++; document.getElementById('zScore').textContent = zScore; }
    if (e.kind === 'vampire')  { vScore++; document.getElementById('vScore').textContent = vScore; }
    if (e.kind === 'rainbow')  { rScore++; document.getElementById('rScore').textContent = rScore; }
    if (e.kind === 'general')  { gScore++; document.getElementById('gScore').textContent = gScore; }
  } else {
    e.bleedTimer = Math.max(e.bleedTimer, 1.5);
    e.bleedAccum = 0;
    e.woundLocal.set(0, Math.max(0.6, hitPoint.y - e.group.position.y), 0);
  }
}

  document.getElementById('crosshair').style.display = 'none';
}


document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOver').classList.remove('show');
  document.getElementById('menu').classList.remove('hidden');
});


function animateEnemyModel(e, time){
  const g = e.group;
  const phase = g.userData.animPhase || 0;
  if (g.userData.earL && g.userData.earR) {
    const wig = Math.sin(time * 3 + phase) * 0.15;
    g.userData.earL.rotation.z = 0.38 + wig;
    g.userData.earR.rotation.z = -0.38 + wig;
  }
  if (g.userData.tailParts) {
    const tp = g.userData.tailParts;
    for (let i = 0; i < tp.length; i++) {
      tp[i].position.x = Math.sin(time * 4 + phase + i * 0.6) * 0.06 * (i + 1);
    }
  }
}


let rainbowHue = 0;
function updateRainbowColor(dt){
  rainbowHue = (rainbowHue + dt * 90) % 360;
  const h = rainbowHue / 360;
  MAT.rainbow.color.setHSL(h, 0.9, 0.6);
  MAT.rainbow.emissive.setHSL(h, 0.9, 0.4);
  MAT.rainbowMouth.color.setHSL(h, 0.9, 0.6);
  MAT.rainbowMouth.emissive.setHSL(h, 0.9, 0.4);
  MAT.rainbowRing.color.setHSL(((rainbowHue + 120) % 360) / 360, 1, 0.55);
}


const clock = new THREE.Clock();
let animTime = 0;


function updatePlayer(dt){
  if (invulnTimer > 0) invulnTimer -= dt;
  if (weaponSwitchCd > 0) weaponSwitchCd -= dt;


  playerRig.rotation.y = yaw;
  camera.rotation.x = pitch;


  const forward = _tmpV1.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = _tmpV2.set(-forward.z, 0, forward.x);
  let mx = 0, mz = 0;
  if (keys['w']||keys['ц']||keys['arrowup'])    { mx += forward.x; mz += forward.z; }
  if (keys['s']||keys['ы']||keys['arrowdown'])  { mx -= forward.x; mz -= forward.z; }
  if (keys['d']||keys['в']||keys['arrowright']) { mx += right.x;   mz += right.z; }
  if (keys['a']||keys['ф']||keys['arrowleft'])  { mx -= right.x;   mz -= right.z; }
  if (joy.active) {
    mx += forward.x * -joy.dy + right.x * joy.dx;
    mz += forward.z * -joy.dy + right.z * joy.dx;
  }
  const moveLen = Math.hypot(mx, mz);
  if (moveLen > 0.001) {
    const k = Math.min(moveLen, 1) / moveLen;
    playerRig.position.x += mx * 5.2 * dt * k;
    playerRig.position.z += mz * 5.2 * dt * k;
  }


  if (keys[' '] && onGround) { velocityY = JUMP_SPEED; onGround = false; }
  velocityY += GRAVITY * dt;
  playerRig.position.y += velocityY * dt;
  if (playerRig.position.y <= 1.7) { playerRig.position.y = 1.7; velocityY = 0; onGround = true; }


  const lim = ARENA - 1.5;
  playerRig.position.x = Math.max(-lim, Math.min(lim, playerRig.position.x));
  playerRig.position.z = Math.max(-lim, Math.min(lim, playerRig.position.z));


  if (moveLen > 0.001 && onGround) weaponBobT += dt * 9;
  const bobY = Math.sin(weaponBobT) * 0.012;
  const bobX = Math.cos(weaponBobT*0.5) * 0.008;
  weaponGroup.position.set(bobX, bobY - recoil, recoil*0.3);
  recoil *= Math.max(0, 1 - dt*10);
  muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt*18);


  if (reloading) {
    reloadTimer -= dt;
    if (reloadTimer <= 0) {
      reloading = false;
      ammo[currentWeapon] = WEAPONS[currentWeapon].maxAmmo;
      updateWeaponHUD();
      document.getElementById('reloadHint').style.display = 'none';
      if (reloadBtnTouch) reloadBtnTouch.classList.remove('cooling');
    }
  }


  fireCooldown -= dt;
  const w = WEAPONS[currentWeapon];
  if (mouseDown && !reloading && (pointerLocked || isTouchDevice) && fireCooldown <= 0) {
    if (ammo[currentWeapon] > 0) {
      shoot();
      ammo[currentWeapon]--;
      updateWeaponHUD();
      fireCooldown = w.fireRate;
      if (ammo[currentWeapon] <= 0) startReload();
    } else {
      startReload();
    }
  }


  animateWeaponModel(dt);
}


function updateEnemies(dt){
  const p = playerRig.position;


  const processEnemy = (e, onAttack, extra) => {
    if (!e.alive) return;
    const pos = e.group.position;
    const dx = p.x - pos.x, dz = p.z - pos.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 1.1) {
      const inv = 1 / dist;
      pos.x += dx * inv * e.speed * dt;
      pos.z += dz * inv * e.speed * dt;
      e.group.rotation.y = Math.atan2(dx, dz);
    } else {
      onAttack();
    }
    if (extra) extra(e, dist);
    if (e.bleedTimer > 0) {
      e.bleedTimer -= dt;
      e.bleedAccum += dt;
      e.group.updateMatrixWorld();
      const step = (e.kind === 'general' || e.kind === 'vampire') ? 0.05 : 0.045;
      while (e.bleedAccum > step) {
        e.bleedAccum -= step;
        const wp = _tmpV1.copy(e.woundLocal);
        e.group.localToWorld(wp);
        spawnBloodStreamDrop(wp);
      }
    }
    animateEnemyModel(e, animTime);
  };


  for (const z of zombies)  processEnemy(z, () => damagePlayer(15));
  for (const r of rainbows) processEnemy(r, () => damagePlayer(15));
  for (const v of vampires) processEnemy(v, () => damagePlayer(10), (e, d) => {
    e.fireCd -= dt;
    if (e.fireCd <= 0 && d < 28) { fireVampireBullet(e); e.fireCd = 1.6 + Math.random(); }
  });
  for (const g of generals) processEnemy(g, () => damagePlayer(20), (e, d) => {
    e.fireCd -= dt;
    if (e.fireCd <= 0 && d < 40) { fireGeneralBullet(e); e.fireCd = 1.2 + Math.random()*0.6; }
  });


  zombies = zombies.filter(e => e.alive);
  vampires = vampires.filter(e => e.alive);
  rainbows = rainbows.filter(e => e.alive);
  generals = generals.filter(e => e.alive);


  const stepProj = (arr, dmg) => {
    for (let i = arr.length - 1; i >= 0; i--) {
      const pr = arr[i];
      pr.mesh.position.addScaledVector(pr.vel, dt);
      pr.life -= dt;
      const tgt = _tmpV1.copy(p); tgt.y += 1.4;
      const dd = pr.mesh.position.distanceToSquared(tgt);
      if (dd < 0.64) { damagePlayer(dmg); scene.remove(pr.mesh); arr.splice(i,1); continue; }
      if (pr.life <= 0) { scene.remove(pr.mesh); arr.splice(i,1); }
    }
  };
  stepProj(vampProjectiles, 8);
  stepProj(genProjectiles, 12);
}


function updatePickups(dt){
  const p = playerRig.position;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.t += dt;
    pk.group.position.y = 1 + Math.sin(pk.t*2)*0.15;
    pk.group.rotation.y += dt*1.2;
    if (pk.group.position.distanceToSquared(p) < 1.96) {
      hp = Math.min(maxHp, hp + 35);
      updateHpUI();
      scene.remove(pk.group);
      pickups.splice(i,1);
    }
  }
}


function updateSpawning(dt){
  zSpawnTimer += dt;
  if (zSpawnTimer >= zSpawnInterval) { zSpawnTimer = 0; spawnZombie(); if (zSpawnInterval > 0.7) zSpawnInterval -= 0.03; }
  vSpawnTimer += dt;
  if (vSpawnTimer >= vSpawnInterval) { vSpawnTimer = 0; spawnVampire(); if (vSpawnInterval > 4) vSpawnInterval -= 0.15; }
  rSpawnTimer += dt;
  if (rSpawnTimer >= rSpawnInterval) { rSpawnTimer = 0; spawnRainbow(); if (rSpawnInterval > 7) rSpawnInterval -= 0.2; }
  gSpawnTimer += dt;
  if (gSpawnTimer >= gSpawnInterval) { gSpawnTimer = 0; spawnGeneral(); if (gSpawnInterval > 18) gSpawnInterval -= 0.5; }
  pickupTimer += dt;
  if (pickupTimer >= pickupInterval) { pickupTimer = 0; spawnPickup(); }
}


function updateEnemyLights(){
  const all = [];
  for (const z of zombies)  all.push(z);
  for (const v of vampires) all.push(v);
  for (const r of rainbows) all.push(r);
  for (const g of generals) all.push(g);
  if (all.length > 1) {
    all.sort((a, b) =>
      a.group.position.distanceToSquared(playerRig.position) -
      b.group.position.distanceToSquared(playerRig.position)
    );
  }
  for (let i = 0; i < MAX_ENEMY_LIGHTS; i++) {
    const l = enemyLightPool[i];
    if (i < all.length) {
      const e = all[i];
      l.position.copy(e.group.position);
      l.position.y += e.glowY;
      l.color.setHex(e.glowColor);
      l.intensity = e.glowIntensity;
      l.distance = e.glowRange;
    } else {
      l.intensity = 0;
    }
  }
}


function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  animTime += dt;
  if (gameActive) {
    updateRainbowColor(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateSparks(dt);
    updateBlood(dt);
    updatePickups(dt);
    updateSpawning(dt);
    updateEnemyLights();
  }
  renderer.render(scene, camera);
}


document.getElementById('hpNum').textContent = hp;
updateWeaponHUD();
animate();
</script>
